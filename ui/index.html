<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Y2 Intel</title>
</head>
<body>
	<main id="app">
		<header class="app-header">
			<div class="identity"><img class="logo" src="/logo.png" width="36" height="36" alt="Y2"><h1 id="title" tabindex="-1">Intelligence</h1></div>
			<div id="controls" hidden>
				<button id="back" type="button" hidden>Back</button>
				<button id="fullscreen" type="button" hidden>Expand</button>
				<button id="open-y2" type="button" disabled>Open Y2</button>
			</div>
		</header>
		<p id="map-context" hidden></p>
		<div id="map" hidden role="region" aria-label="Map of public intelligence events" aria-describedby="legend"></div>
		<p id="legend" hidden role="status"></p>
		<div class="result-toolbar">
			<p id="status" role="status" aria-live="polite">Waiting for authorized intelligence…</p>
			<details id="options" hidden>
				<summary>Filters &amp; details</summary>
				<div class="options-panel">
					<form id="map-filters" hidden aria-label="Map query filters">
						<label>Category <select id="category"><option value="">All categories</option></select></label>
						<label>Severity <select id="severity"><option value="">All severities</option><option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></label>
						<label>Event time <select id="time-range"><option value="">Keep current time range</option><option value="day">Past 24 hours</option><option value="week">Past 7 days</option><option value="month">Past 30 days</option></select></label>
						<button id="apply-filters" type="submit">Apply filters</button>
					</form>
					<label id="priority-control">Priority in loaded results
						<select id="priority"><option value="">All priorities</option><option value="critical">Critical</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
					</label>
					<p id="query" class="muted"></p>
					<p id="workspace" class="muted"></p>
					<p id="freshness" class="muted"></p>
					<p id="notice" class="muted"></p>
				</div>
			</details>
		</div>
		<section id="items" aria-label="Intelligence results" aria-busy="false"></section>
		<button id="more" type="button" hidden>Load more</button>
	</main>
	<script type="module" src="/main.ts"></script>
</body>
</html>
